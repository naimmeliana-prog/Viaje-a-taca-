name: Actualizar herramientas IA
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - name: Buscar y actualizar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_tools.py
      - name: Guardar cambios
        run: |
          git config user.name "Viaje a Itaca"
          git config user.email "bot@viajeaitaca.es"
          git add herramientas.json
          git diff --cached --quiet || git commit -m "Actualizacion semanal" && git push
