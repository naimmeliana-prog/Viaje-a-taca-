name: Actualizar herramientas IA
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python scripts/update_tools.py
      - run: |
          git config user.name "Viaje a Itaca"
          git config user.email "bot@viajeaitaca.es"
          git add herramientas.json
          git diff --cached --quiet || git commit -m "Actualizacion semanal" && git push
