name: Actualizar herramientas IA

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install feedparser requests

      - name: Buscar nuevas herramientas (3 capas)
        run: python update_tools.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit si hay cambios
        run: |
          git config user.name "Viaje a Itaca"
          git config user.email "bot@viajeaitaca.es"
          git add herramientas.json
          git diff --cached --quiet || git commit -m "Actualizacion semanal" && git push
