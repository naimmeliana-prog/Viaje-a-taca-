name: Actualizar herramientas IA
on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: "Activar modo prueba"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - name: Forzar modelos gratuitos
        run: |
          sed -i 's/"meta-llama\/llama-3.3-70b-instruct:free"/"google\/gemini-2.0-flash-lite-preview-02-05:free"/g' update_tools.py
          sed -i 's/"google\/gemini-2.0-flash-lite-preview-02-05:free"/"google\/gemini-2.0-pro-exp-02-05:free"/g' update_tools.py
          sed -i 's/"qwen\/qwen-2.5-coder-32b-instruct:free"/"cognitivecomputations\/dolphin3.0-r1-mistral-24b:free"/g' update_tools.py
          sed -i 's/"mistralai\/mistral-7b-instruct:free"/"deepseek\/deepseek-r1:free"/g' update_tools.py
          # Borrar las pausas largas de 20 y 40 segundos
          sed -i 's/ESPERA_BASE=20/ESPERA_BASE=3/g' update_tools.py
      - name: Buscar herramientas
        env:
          OPENROUTER_API_KEY: ${{ secrets.ITACA }}
          MODO_PRUEBA: ${{ inputs.modo_prueba || '0' }}
        run: python3 update_tools.py

      - name: Regenerar data/herramientas.js
        run: python3 build_js.py

      - name: Guardar en GitHub
        run: |
          git config user.name "Viaje a Itaca"
          git config user.email "bot@viajeaitaca.es"
          git add herramientas.json data/herramientas.js noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Actualizacion automatica del catalogo"
            git push
          fi

      - name: Subir a InfinityFree (JSON + JS)
        if: ${{ env.FTP_HOST != '' }}
        run: |
          python3 -c "
          import ftplib, os
          ftp = ftplib.FTP_TLS()
          ftp.connect(os.environ['FTP_HOST'], 21, timeout=30)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
          ftp.prot_p()
          ftp.cwd('htdocs/data')
          for nombre in ('herramientas.json', 'data/herramientas.js', 'noticias.json'):
              local = nombre
              remoto = os.path.basename(nombre)
              with open(local, 'rb') as f:
                  ftp.storbinary('STOR ' + remoto, f)
              print('Subido a InfinityFree:', remoto)
          ftp.quit()
          "
